spring:
  application:
    name: user-service
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://localhost:5432/user_service_db}"
    username: "${DATABASE_USERNAME:user_service}"
    password: "${DATABASE_PASSWORD:user_service_password}"
  jpa:
    hibernate:
      ddl-auto: "${JPA_DDL_AUTO:update}"
    open-in-view: false

server:
  port: 8080

auth:
  jwt:
    secret: "${JWT_SECRET:+Ko8oNC676s6D5pEdWC3BbvvFV/ZYBX1F9gjTU/n5Ts=}"
    issuer: "${JWT_ISSUER:ecommerce-user-service}"
    ttl: PT1H
  bootstrap:
    enabled: "${AUTH_BOOTSTRAP_ENABLED:true}"
    user:
      username: "${AUTH_USER_USERNAME:user}"
      password: "${AUTH_USER_PASSWORD:password}"
    admin:
      username: "${AUTH_ADMIN_USERNAME:admin}"
      password: "${AUTH_ADMIN_PASSWORD:admin}"
