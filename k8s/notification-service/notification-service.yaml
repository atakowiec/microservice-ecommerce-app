apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: atakowiec/notification-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: ecommerce-kafka:9092
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-credentials
                  key: jwt-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8083
      targetPort: http
