apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: atakowiec/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8080
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:8081
            - name: ORDER_SERVICE_URL
              value: http://order-service:8082
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8083
            - name: FRONTEND_URL
              value: https://ecommerce.cieszczyk.pl
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-credentials
                  key: jwt-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
