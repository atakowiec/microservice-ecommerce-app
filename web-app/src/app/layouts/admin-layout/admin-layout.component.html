<div class="admin-shell admin-theme">
    <aside>
        <a class="admin-brand" routerLink="/admin">
            <span class="admin-brand__mark">N</span>
            <span>
        <strong>Admin</strong>
        <small>Management panel</small>
      </span>
        </a>

        <nav aria-label="Admin navigation">
            <p>Store</p>
            <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="isActiveMatchOptions">
                Overview
            </a>
            <a routerLink="/admin/products" routerLinkActive="active" [routerLinkActiveOptions]="isActiveMatchOptions">
                Product list
            </a>
            <p>Users</p>
            <a routerLink="/admin/users" routerLinkActive="active" [routerLinkActiveOptions]="isActiveMatchOptions">
                User Management
            </a>
        </nav>

        <div class="admin-user">
            <span class="admin-user__avatar">{{ auth.username()?.charAt(0)?.toUpperCase() }}</span>
            <span>
        <strong>{{ auth.username() }}</strong>
        <small>Administrator</small>
      </span>
            <button type="button" (click)="signOut()" aria-label="Sign out">↗</button>
        </div>
    </aside>

    <div class="admin-main">
        <header>
            <a routerLink="/">Back to home</a>
        </header>
        <main>
            <router-outlet/>
        </main>
    </div>
</div>
